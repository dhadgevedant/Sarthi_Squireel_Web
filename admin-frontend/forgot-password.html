<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Squirrel Nuts Admin</title>
  <link rel="icon" href="https://squirrelnuts.in/wp-content/uploads/2024/07/cropped-Black-and-Yellow-Grunge-Financial-Logo-270x270.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <div class="auth-header">
        <a href="index.html" class="logo">Squirrel<span>Nuts</span></a>
        <p class="auth-subtitle">Admin Panel</p>
      </div>

      <form id="forgotPasswordForm" class="auth-form">
        <h2>Reset Password</h2>
        <p style="color:#666; margin-bottom:25px; font-size:14px;">Enter your email and phone number to receive a temporary password.</p>

        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="forgotEmail" placeholder="admin@squirrelnuts.in" required>
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" id="forgotPhone" placeholder="+91 9876543210" required>
        </div>

        <button type="submit" class="btn btn-block">Get Temporary Password</button>

        <p style="text-align:center; margin-top:20px; font-size:13px; color:#666;">
          Remember your password? <a href="login.html" style="color:var(--orange); font-weight:600;">Sign In</a>
        </p>
      </form>

      <div id="forgotResult" style="display:none; margin-top:20px; padding:20px; background:#f8f9fa; border-radius:12px; text-align:center;">
        <h3 style="margin-bottom:10px;">Temporary Password</h3>
        <p style="color:#666; font-size:14px; margin-bottom:15px;">Use this password to login. You can change it later from Settings.</p>
        <p id="tempPasswordDisplay" style="font-size:22px; font-weight:800; color:#1c1c1c; letter-spacing:2px;"></p>
        <button type="button" class="btn" style="margin-top:20px;" onclick="window.location.href='login.html'">Go to Login</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
